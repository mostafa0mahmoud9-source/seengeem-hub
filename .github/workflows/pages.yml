name: Pages
# كل تعديل على واجهة التطبيق (mobile/www) يُنشر تلقائيًا خلال دقيقة، وبيوصل للكمبيوتر والموبايل بدون إعادة تثبيت
on:
  push:
    branches: [main]
    paths: ['mobile/www/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: mobile/www }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
