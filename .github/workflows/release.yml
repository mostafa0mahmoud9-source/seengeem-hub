name: Release
# تشغيل: من تبويب Actions اضغط Run workflow، أو أنشئ Release جديد باسم tag مثل v2.2.1
on:
  workflow_dispatch:
    inputs:
      version: { description: 'رقم الإصدار (مثال 2.2.1)', required: true, default: '2.3.0' }
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  VER: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ضبط الإصدار
        shell: bash
        run: |
          V="${VER#v}"
          REV=$(TZ=UTC git log -1 --format=%cd --date=format:%Y%m%d%H%M%S -- desktop/wa.js mobile/engine/main.js)
          sed -i "s#BUILD_REV = 0, BUILD_VER = '0.0.0'#BUILD_REV = ${REV}, BUILD_VER = '${V}'#" desktop/main.js
          grep -n "BUILD_REV = " desktop/main.js | head -2
          sed -i "s#NATIVE_VER='0.0.0'#NATIVE_VER='${V}'#" mobile/www/index.html
          cd desktop
          npm pkg set version="$V"
          npm pkg set "build.publish[0].owner=${GITHUB_REPOSITORY_OWNER}"
          npm pkg set "build.publish[0].repo=${GITHUB_REPOSITORY#*/}"
      - name: لوجو المنصة
        shell: bash
        run: |
          ls -la desktop/assets/brand.png
          test "$(stat -c%s desktop/assets/brand.png)" -gt 5000 || { echo "اللوجو ناقص"; exit 1; }
      - run: npm install
        working-directory: desktop
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: بناء وتوقيع الـ APK
        run: |
          V="${VER#v}"
          REV=$(TZ=UTC git log -1 --format=%cd --date=format:%Y%m%d%H%M%S -- desktop/wa.js mobile/engine/main.js)
          sed -i "s#BUILD_REV = 0, BUILD_VER = globalThis.__SGB_BVER || '0.0.0'#BUILD_REV = ${REV}, BUILD_VER = globalThis.__SGB_BVER || '${V}'#" mobile/engine/main.js
          grep -n "BUILD_REV = " mobile/engine/main.js | head -2
          sed -i "s#NATIVE_VER='0.0.0'#NATIVE_VER='${V}'#" mobile/www/index.html
          cd mobile
          npm install --legacy-peer-deps
          npm install https://github.com/hampoelz/capacitor-nodejs/releases/download/v1.0.0-beta.7/capacitor-nodejs.tgz --legacy-peer-deps || npm install https://github.com/hampoelz/capacitor-nodejs/releases/download/v1.0.0-beta.6/capacitor-nodejs.tgz --legacy-peer-deps
          mkdir -p www/nodejs && cp engine/main.js engine/package.json www/nodejs/
          (cd www/nodejs && npm install --omit=dev --no-audit --no-fund)
          npx cap add android
          sed -i 's/minSdkVersion = 2[0-9]/minSdkVersion = 24/' android/variables.gradle
          echo "org.gradle.jvmargs=-Xmx3g" >> android/gradle.properties
          cp ../desktop/assets/brand.png $RUNNER_TEMP/logo.png
          command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1 || { sudo apt-get update -y >/dev/null 2>&1; sudo apt-get install -y imagemagick >/dev/null 2>&1; }
          IM=$(command -v magick || command -v convert)
          [ -n "$IM" ] || { echo "ImageMagick غير متوفر"; exit 1; }
          R=android/app/src/main/res
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d s f <<< "$spec"; g=$((f*2/3))
            $IM $RUNNER_TEMP/logo.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            $IM $RUNNER_TEMP/logo.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher_round.png
            $IM $RUNNER_TEMP/logo.png -resize ${g}x${g} -background none -gravity center -extent ${f}x${f} $R/mipmap-$d/ic_launcher_foreground.png
          done
          sed -i 's/#FFFFFF/#6a3dc0/I' $R/values/ic_launcher_background.xml || true
          ls -la $R/mipmap-xxxhdpi/
          npx cap sync android
          python3 scripts/patch-android.py android
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${V}\"/" android/app/build.gradle
          (cd android && ./gradlew assembleRelease)
          D=android/app/build/outputs/apk/release
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 $D/app-release-unsigned.apk $D/aligned.apk
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/ks.jks
          $BT/apksigner sign --ks $RUNNER_TEMP/ks.jks --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} --ks-key-alias seengeem --out $D/SeenGeem-Assistant.apk $D/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/android/app/build/outputs/apk/release/SeenGeem-Assistant.apk

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd wp-plugin && zip -r ../seengeem-wa-bridge.zip seengeem-wa-bridge
      - uses: actions/upload-artifact@v4
        with: { name: plugin, path: seengeem-wa-bridge.zip }

  publish:
    needs: [desktop, android, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: out/*
