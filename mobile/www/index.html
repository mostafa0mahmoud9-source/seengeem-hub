<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b0f82">
<title>مساعد سين جيم</title>
<style>
:root{--p:#3b0f82;--p2:#6a35c9;--bg:#f4f1fa;--c:#fff;--t:#1d1530;--m:#6b6480;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}header small{opacity:.8}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #e5def5;position:sticky;top:56px;z-index:4}
nav button{border:0;background:#efe9fb;color:var(--p);padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--p);color:#fff}
main{padding:12px;max-width:900px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--c);border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001;margin-bottom:10px}
.num{font-size:28px;font-weight:700;color:var(--p)}.lbl{color:var(--m);font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.row:last-child{border:0}
.b{padding:2px 9px;border-radius:12px;font-size:12px;color:#fff;white-space:nowrap}
.sent,.delivered,.read{background:var(--ok)}.failed{background:var(--bad)}.queued,.qr_pending,.sending{background:var(--warn)}
.read{background:#0891b2}
input,select,textarea{width:100%;padding:11px;border:1px solid #d9d0ee;border-radius:10px;font:inherit;margin:4px 0 10px;background:#fff}
.btn{background:var(--p);color:#fff;border:0;padding:11px 18px;border-radius:10px;font:inherit;cursor:pointer}
.btn.alt{background:#efe9fb;color:var(--p)}
.hide{display:none}.err{color:var(--bad)}.ok{color:var(--ok)}
iframe{width:100%;height:78vh;border:0;border-radius:12px;background:#fff}
.body{color:var(--m);font-size:13px;margin-top:2px}
</style>
</head>
<body>
<header><div><h1>مساعد سين جيم</h1><small id="sub">غير متصل</small></div><button class="btn alt" onclick="load()">تحديث ↻</button></header>
<nav id="nav">
<button data-t="home" class="on">نظرة عامة</button><button data-t="queue">الرسائل</button><button data-t="inc">الردود</button>
<button data-t="send">إرسال تجربة</button><button data-t="assist">المساعد</button><button data-t="cfg">الإعدادات</button>
</nav>
<div id="upd" class="card hide" style="margin:10px 12px;background:#fff7e0"></div>
<main>
<section id="home">
  <div class="grid" id="kpis"></div>
  <div class="card"><b>القنوات</b><div id="chs"></div></div>
</section>
<section id="queue" class="hide"><div class="card" id="qlist"></div><button class="btn alt" onclick="retry()">إعادة محاولة الفاشل</button></section>
<section id="inc" class="hide"><div class="card" id="ilist"></div></section>
<section id="send" class="hide"><div class="card">
  <label>القناة</label><select id="tch"><option value="students">الطلاب وأولياء الأمور</option><option value="staff">المدرسين والمتابعة</option></select>
  <label>رقم الموبايل</label><input id="tph" inputmode="tel" placeholder="01012345678">
  <label>الرسالة</label><textarea id="tbd" rows="4">رسالة تجربة من مساعد سين جيم 💜</textarea>
  <button class="btn" onclick="sendTest()">إرسال</button> <span id="tres"></span></div></section>
<section id="assist" class="hide"><iframe id="fr"></iframe></section>
<section id="cfg" class="hide"><div class="card">
  <label>رابط الموقع</label><input id="url" placeholder="https://seengeem-eg.com">
  <label>مفتاح الربط (X-SGB-Key)</label><input id="key" type="password" autocomplete="off">
  <button class="btn" onclick="saveCfg()">حفظ واتصال</button> <span id="cres"></span>
  <p class="lbl">المفتاح موجود في ووردبريس ← واتساب المساعد. يُحفظ على جهازك فقط.</p></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const S={url:localStorage.getItem('sgb_url')||'',key:localStorage.getItem('sgb_key')||''};
$('url').value=S.url;$('key').value=S.key;
const ST={queued:'بالانتظار',qr_pending:'بانتظار QR',sending:'جاري',sent:'أُرسلت',delivered:'وصلت',read:'قُرئت',failed:'فشلت'};
const CH={students:'طلاب/أولياء',staff:'مدرسين/متابعة'};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t){document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hide',s.id!==t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='assist'&&S.url&&!$('fr').src)$('fr').src=S.url.replace(/\/$/,'')+'/seengeem-assistant/';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(path,opt={}){
  const r=await fetch(S.url.replace(/\/$/,'')+'/wp-json/sgb/v1/'+path,{...opt,headers:{'X-SGB-Key':S.key,'Content-Type':'application/json'}});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||('HTTP '+r.status));return j;}
async function load(){
  if(!S.url||!S.key){show('cfg');return;}
  try{
    const d=await api('stats');
    $('sub').textContent='آخر تحديث '+new Date(d.time*1000).toLocaleTimeString('ar-EG')+(d.quiet_now?' · ساعات الهدوء':'');
    const sum=st=>d.by.filter(x=>x.status===st).reduce((a,x)=>a+ +x.n,0);
    const k=[['أُرسل اليوم',d.sent_today],['بالانتظار',sum('queued')+sum('sending')],['بانتظار QR',sum('qr_pending')],['وصلت',sum('delivered')+sum('read')],['فشلت',sum('failed')]];
    $('kpis').innerHTML=k.map(([l,n])=>`<div class="card"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join('');
    $('chs').innerHTML=Object.entries(d.channels).map(([k,c])=>`<div class="row"><span>${esc(c.label)}</span><span class="${c.cloud_ready?'ok':'err'}">${c.cloud_ready?'Cloud API جاهز':'Cloud API غير مضبوط'} · ${c.mode}</span></div>`).join('');
    $('qlist').innerHTML=d.recent.map(r=>`<div class="row"><div><b>${esc(r.to_phone)}</b> · ${CH[r.channel]}${r.rule_key?' · '+esc(r.rule_key):''}<div class="body">${esc((r.body||'').slice(0,90))}${r.error?'<br><span class="err">'+esc(r.error)+'</span>':''}</div></div><span class="b ${r.status}">${ST[r.status]||r.status}</span></div>`).join('')||'<div class="lbl">لا توجد رسائل</div>';
    $('ilist').innerHTML=d.incoming.map(r=>`<div class="row"><div><b>${esc(r.from_phone)}</b> · ${CH[r.channel]}<div class="body">${esc(r.body)}</div></div><span class="lbl">${new Date(r.created*1000).toLocaleString('ar-EG')}</span></div>`).join('')||'<div class="lbl">لا توجد ردود</div>';
  }catch(e){$('sub').textContent='خطأ: '+e.message;}
}
async function retry(){try{await api('retry',{method:'POST',body:'{}'});load();}catch(e){alert(e.message)}}
async function sendTest(){try{await api('send-test',{method:'POST',body:JSON.stringify({channel:$('tch').value,phone:$('tph').value,body:$('tbd').value})});$('tres').innerHTML='<span class="ok">أُضيفت للطابور ✅</span>';load();}catch(e){$('tres').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
async function saveCfg(){S.url=$('url').value.trim();S.key=$('key').value.trim();localStorage.setItem('sgb_url',S.url);localStorage.setItem('sgb_key',S.key);
  try{await api('stats');$('cres').innerHTML='<span class="ok">متصل ✅</span>';show('home');load();}catch(e){$('cres').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
const REPO='REPLACE_GITHUB_USER/seengeem-hub',VER='2.0.0';
(async()=>{try{if(REPO.startsWith('REPLACE'))return;const r=await fetch('https://api.github.com/repos/'+REPO+'/releases/latest').then(r=>r.json());
 const v=(r.tag_name||'').replace(/^v/,'');if(v&&v!==VER){const u=$('upd');u.classList.remove('hide');u.innerHTML='تحديث جديد '+esc(v)+' متاح — <a href="'+esc(r.html_url)+'" target="_blank">تنزيل</a>';}}catch(e){}})();
load();setInterval(()=>{if(!document.hidden)load()},15000);
</script>
</body>
</html>
